<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Watchlist</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="app">

    <header>
        <div>
            <h1>Watchlist</h1>
            <p class="subtitle">Фильмы и сериалы</p>
        </div>

        <button class="add-button" type="button" disabled>+</button>
    </header>

    <div class="search">
        <input
            id="search"
            type="search"
            placeholder="Поиск..."
            autocomplete="off"
        >
    </div>

    <div class="filters">
        <div class="filter-group" id="statusFilters">
            <button class="active" data-status="all">Все</button>
            <button data-status="unwatched">Не просмотрено</button>
            <button data-status="watched">Просмотрено</button>
        </div>

        <div class="filter-group" id="typeFilters">
            <button class="active" data-type="all">Все</button>
            <button data-type="movie">Фильмы</button>
            <button data-type="series">Сериалы</button>
        </div>
    </div>

    <div id="loading" class="message">
        Загружаю список…
    </div>

    <div id="error" class="message error" hidden>
        Не удалось загрузить Watchlist
    </div>

    <section id="list" class="list"></section>

    <div id="empty" class="message" hidden>
        Ничего не найдено
    </div>

    <footer>
        <span>Всего: <strong id="totalCount">0</strong></span>
        <span>Осталось: <strong id="remainingCount">0</strong></span>
    </footer>

</main>

<script src="app.js"></script>

</body>
</html>
